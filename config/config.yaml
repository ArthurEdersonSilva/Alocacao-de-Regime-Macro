  fontes_resultados:
    encontrada: data/processed/renda_fixa_encontrada.csv
    aprovada: data/processed/renda_fixa_aprovada.csv
    representantes_modelo: data/processed/renda_fixa_modelo.csv
  categorias_modelo:
    pos_fixada:
      identificador: CDI
      classe: RENDA_FIXA_POS_FIXADA
      selecionada: false
    inflacao:
      identificador: IMA_B
      classe: RENDA_FIXA_INFLACAO
      selecionada: false
    prefixada:
      identificador: IRF_M
      classe: RENDA_FIXA_PREFIXADA
      selecionada: false
  exigir_validacao_da_serie: true
  exigir_data_inicial_compativel: true
  exigir_aprovacao_manual: true
coleta_yfinance:
  ativa: true
  fonte: yahoo_finance
  periodo:
    data_inicial: '2020-01-01'
    data_final: null
    usar_data_atual: true
    adicionar_dias_data_final_yfinance: 1
  requisicao:
    intervalo: 1d
    auto_adjust: false
    actions: false
    progress: false
    threads: false
    multi_level_index: false
  tentativas:
    quantidade_maxima: 3
    timeout_segundos: 30
    usar_espera_progressiva: true
    multiplicador_espera_segundos: 2
    intervalo_entre_ativos_segundos: 0.5
  campos_obrigatorios:
  - data
  - ticker
  - classe
  - open
  - high
  - low
  - close
  - adj_close
  - volume
  preco_principal: adj_close
  preco_alternativo: close
  validacao:
    data_limite_inicio: '2020-01-15'
    tolerancia_final_dias: 10
    cobertura_minima: 0.94
    percentual_maximo_nulos: 0.01
    maximo_dias_preco_congelado: 10
    maximo_linhas_suspeitas_consecutivas: 3
    maximo_intervalo_dias: 10
    maximo_retorno_diario_absoluto: 0.5
    percentual_maximo_ohlc_invalido: 0.001
    exigir_sem_duplicados: true
    exigir_precos_positivos: true
    exigir_retorno_calculavel: true
    volume_zero_permitido_para_moedas: true
  saidas:
    validacao_ativos: data/processed/validacao_ativos_yfinance.csv
    precos_utilizaveis: data/processed/precos_ativos_utilizaveis.csv
    renda_fixa_encontrada: data/processed/renda_fixa_encontrada.csv
    renda_fixa_aprovada: data/processed/renda_fixa_aprovada.csv
    renda_fixa_modelo: data/processed/renda_fixa_modelo.csv
